"mmproj-LFM2.5-VL-3B-Q8_0.gguf" = "https://huggingface.co/LiquidAI/LFM2.5-VL-3B-GGUF/resolve/main/mmproj-LFM2.5-VL-3B-Q8_0.gguf"

