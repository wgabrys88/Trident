[address]
timer = "10"
telegram = "11"
ears = "12"
voice = "13"
tools = "14"
mind = "16"
memory = "50"
[bus]
poll = 0.05
frame_timeout = 5
data_retries = 1
self_turn_cap = 64
[holds]
tools = 7200
[supply]
stop_seconds = 30
restart_cap = 3
stable_seconds = 30
backoff = 1
[limits]
grid = 1000
http_seconds = 7100
health_seconds = 10
health_poll = 0.2
server_tail_bytes = 16384
install_seconds = 3600
[timer]
redial_seconds = 120
redial_cap = 3
idle_seconds = 900
idle_text = "Idle tick: read the task stack, then decide whether to continue, ask the owner, or rest."
[telegram]
owner = 5884279027
tdata = "%APPDATA%/Telegram Desktop/tdata"
bridge = "20"
bridge_seconds = 300
call_grant_seconds = 120
bridge_release = "back to Luna"
ring_seconds = 90
connect_seconds = 30
min_layer = 65
dh_bytes = 256
random_id_max = 2147483648
chat_chars = 4096
caption_chars = 1024
album_files = 10
voice_notes = true
[audio]
receive_rate = 16000
send_rate = 48000
sample_bytes = 2
send_frame_bytes = 960
frame_ms = 20
padding_ms = 120
rms_threshold = 0.012
silence_ms = 1600
min_speech_ms = 200
barge_in_ms = 300
barge_hold_seconds = 2
utterance_seconds = 30
[ears]
library = "artifacts/ears/bin/nemo_speech_asr_c.dll"
model = "nemotron-speech-streaming-en-0.6b.q8_0.gguf"
gpu = 0
start_seconds = 300
[voice]
url = "http://127.0.0.1:8091"
start_seconds = 300
command = ["artifacts/voice/crispasr-windows-x86_64-cuda126/crispasr.exe", "--server", "--host", "127.0.0.1", "--port", "8091", "--backend", "chatterbox-nano", "-m", "{models}/chatterbox-nano-t3-q4_k.gguf", "--codec-model", "{models}/chatterbox-turbo-s3gen-q4_k.gguf", "--gpu-backend", "cuda", "--no-punctuation"]
[mind.luna]
transport = "cli"
identity = "Cursor; gpt-5.6-luna-none; agent"
model = "gpt-5.6-luna-none"
versions = "%LOCALAPPDATA%/cursor-agent/versions"
turn_seconds = 7200
context_chars = 400000
event_bytes = 2000000
[mind.lfm]
transport = "http"
# LFM2.5-VL-3B is a direct-answer, non-reasoning model.
reasoning = "off"
identity = "LiquidAI; LFM2.5-VL-3B; BF16; text"
url = "http://127.0.0.1:8081"
port = 8081
turn_seconds = 7200
context_chars = 100000
start_seconds = 300
max_tokens = 32768
[llama]
model = "lfm"
# Full-precision upstream GGUF model and projector (requires substantially more RAM/VRAM).
# For low-memory machines, revert BOTH filenames to Q4_K_M / Q8_0.
model_file = "LFM2.5-VL-3B-BF16.gguf"
projector_file = "mmproj-LFM2.5-VL-3B-BF16.gguf"
start_seconds = 300
context = 32768
command = ["artifacts/llama/llama-server.exe", "-m", "{models}/{model_file}", "--mmproj", "{models}/{projector_file}", "--mmproj-offload", "--mmproj-device", "CUDA0", "--alias", "{model}", "--host", "127.0.0.1", "--port", "{port}", "--jinja", "--ctx-size", "{context}", "--device", "CUDA0", "--parallel", "1", "--batch-size", "2048", "--ubatch-size", "512", "--flash-attn", "on", "--cache-type-k", "f16", "--cache-type-v", "f16", "--reasoning", "{reasoning}", "--no-context-shift", "--check-tensors", "--no-webui", "--fit", "on"]
reasoning = "off"
[sampling]
temperature = 0.2
top_k = 50
top_p = 1.0
min_p = 0.0
repeat_penalty = 1.0
[vision]
url = "http://127.0.0.1:8080"
port = 8080
context = 32768
reasoning = "off"
max_tokens = 8192
temperature = 0
boxes_system = "Locate only the objects or regions requested by the question in the supplied screenshot. Return ONLY a JSON array with one object per visible match: {\"image_id\":0,\"bbox_2d\":[xmin,ymin,xmax,ymax],\"label\":\"short description\"}. Coordinates are normalized 0..1000 within THIS supplied image, with x horizontal and y vertical; use tight boxes. If the target cannot be reliably distinguished, return []. Never invent a box."
text_system = "You are inspecting a full-resolution desktop screenshot or an exact screenshot crop. Answer the user question using only visible evidence. Transcribe small text exactly when legible. Distinguish observation from inference, and explicitly state uncertainty when details are unreadable; never guess a successful click, saved file or posted message from an acknowledgement. If the question needs a tighter view, say which region should be cropped for another look."
[tools]
command_seconds = 7180
input_pause = 0.1
settle_seconds = 5
launch_seconds = 5
[actions]
say = "TEXT | report accepted for delivery; receipt and hearing unverified; continues current goal"
done = "TEXT | sends the final answer or report and ends the current goal"
nothing = "| rests without reporting or continuation"
[registers.timer]
"00" = "read: redial_state | | 00 idle or 01 waiting"
"02" = "write: schedule_redial | | accepted; the effect is not verified yet"
"03" = "write: cancel_redial | | accepted; the effect is not verified yet"
[registers.telegram]
"00" = "read: call_state | | 00 down, 01 dialing, 02 connected"
"01" = "write: dial | | places a call only when the device already has owner permission"
"02" = "write: hangup | | ends the call"
"03" = "write: authorize_call | | mind conveys the owner's explicit request to call; grants one outgoing attempt for call_grant_seconds, then choose dial"
"10" = "write: - | | owner speech is say or done"
"11" = "write: album | PATH\nCAPTION | submits an image album; not confirmed delivery"
"20" = "write: call_audio | PATH | plays that pcm wav on the call"
"21" = "write: note_audio | PATH | plays that ogg as a voice note"
[registers.ears]
"01" = "write: transcribe | PATH | transcript text"
[registers.voice]
"01" = "write: speak_call | TEXT | synthesizes call speech"
"02" = "write: speak_note | TEXT | synthesizes an off-call voice note"
[registers.tools]
"01" = "read: screenshot | NAME.png [XMIN YMIN XMAX YMAX] | optional crop is four integers 0-1000 with increasing X and Y; a new picture path, unseen until look"
"02" = "read: command | COMMAND | runs in cmd.exe in the current run directory; waits for the shell process to exit; use a detached shell launch when an application must stay open. Returns exit code and output; exit zero is acceptance, not a visible effect"
"03" = "read: look | PATH\nMODE\nQUESTION | PATH is the newest picture path returned. MODE is text or boxes. QUESTION is the exact visual request. text returns the answer; boxes returns bbox_2d [xmin, ymin, xmax, ymax] and centre_y_x [Y, X], normalized integers 0-1000. Mode never depends on keywords."
"04" = "read: stroke | OPERATION ARGUMENTS | an after-shot path, unseen until look. Shapes: click Y X; draw Y X Y X Y X; type TEXT (paste only, never presses Enter); key NAME or key ctrl+NAME / ctrl+shift+NAME. Use a separate key enter to submit. Y then X, integers 0-1000, the same order as centre_y_x. Y is vertical and stays within ymin and ymax; X is horizontal and stays within xmin and xmax. Replace every capital placeholder."
"05" = "read: share | PATH | submission, not confirmed delivery"
[registers.mind]
"00" = "read: - | | internal"
"01" = "write: plan | TEXT | short numbered plan on this channel only; not delivered to the owner and not a completed goal"
"f0" = "read: - | | internal"
[registers.memory]
"01" = "write/read: remember | TEXT | a decimal id"
"02" = "read: recall | ID | the note for that id"
"03" = "read: latest | | the latest note"
[models]
path = "%LOCALAPPDATA%/Trident/models"
[downloads]
models = { "nemotron-speech-streaming-en-0.6b.q8_0.gguf" = "https://huggingface.co/nvidia/nemotron-speech-streaming-en-0.6b/resolve/ebe59e5a817142986528bbbee5dba8db7b38ed50/nemotron-speech-streaming-en-0.6b.q8_0.gguf", "LFM2.5-VL-3B-BF16.gguf" = "https://huggingface.co/LiquidAI/LFM2.5-VL-3B-GGUF/resolve/6f730e9a2c454e8af9adc29db58e638e01e5957f/LFM2.5-VL-3B-BF16.gguf", "mmproj-LFM2.5-VL-3B-BF16.gguf" = "https://huggingface.co/LiquidAI/LFM2.5-VL-3B-GGUF/resolve/6f730e9a2c454e8af9adc29db58e638e01e5957f/mmproj-LFM2.5-VL-3B-BF16.gguf", "LFM2.5-VL-3B-Q4_K_M.gguf" = "https://huggingface.co/LiquidAI/LFM2.5-VL-3B-GGUF/resolve/6f730e9a2c454e8af9adc29db58e638e01e5957f/LFM2.5-VL-3B-Q4_K_M.gguf", "mmproj-LFM2.5-VL-3B-Q8_0.gguf" = "https://huggingface.co/LiquidAI/LFM2.5-VL-3B-GGUF/resolve/6f730e9a2c454e8af9adc29db58e638e01e5957f/mmproj-LFM2.5-VL-3B-Q8_0.gguf", "chatterbox-nano-t3-q4_k.gguf" = "https://huggingface.co/cstr/chatterbox-nano-GGUF/resolve/e974b29a5aa94ddf1ea8653e79e1601fecb8ba16/chatterbox-nano-t3-q4_k.gguf", "chatterbox-turbo-s3gen-q4_k.gguf" = "https://huggingface.co/cstr/chatterbox-turbo-GGUF/resolve/b544cf8b49504d880640864a757b3ff3e4421a42/chatterbox-turbo-s3gen-q4_k.gguf" }
archives = { ears = "https://github.com/NVIDIA/NeMo-Speech.cpp/releases/download/v0.1.0/nemo-speech-0.1.0-windows-x86_64-vulkan.zip", voice = "https://github.com/CrispStrobe/CrispASR/releases/download/v0.8.41/crispasr-windows-x86_64-cuda126.zip", llama = "https://github.com/ggml-org/llama.cpp/releases/download/b11435/llama-b11435-bin-win-cuda-12.4-x64.zip", cudart = "https://github.com/ggml-org/llama.cpp/releases/download/b11435/cudart-llama-bin-win-cuda-12.4-x64.zip" }
