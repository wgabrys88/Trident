helper_cap = 100
compact_at = 24000

[owner]
telegram_id = 5884279027
name = "Wojciech"

[paths]
models = "models"
bin = "bin"
state = "state"

[hardware]
# Auto priority is profile order: NVIDIA, AMD, Intel. An explicit name overrides detection.
profile = "auto"

[hardware.profiles.cuda]
adapter_names = ["nvidia"]
llama_assets = ["llama-{tag}-bin-win-cuda-12.4-x64.zip", "cudart-llama-bin-win-cuda-12.4-x64.zip"]
server_args = ["--flash-attn", "on", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0"]

[hardware.profiles.rocm]
adapter_names = ["amd", "radeon", "advanced micro devices"]
llama_assets = ["llama-{tag}-bin-win-rocm-10.0-x64.zip"]
server_args = ["--flash-attn", "on", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0"]
sdk = ["--index-url", "https://stable.repo.amd.com/rocm/whl-next/", "rocm[libraries]==10.0.0"]

[hardware.profiles.vulkan]
adapter_names = ["intel"]
llama_assets = ["llama-{tag}-bin-win-vulkan-x64.zip"]
# Quantized V requires flash attention, unavailable on some Intel integrated GPUs.
server_args = ["--flash-attn", "auto", "--cache-type-k", "q8_0", "--cache-type-v", "f16"]

[brain]
api_model = "Gemma"
model = "gemma-4-E2B-it-Q4_0.gguf"
mmproj = "mmproj-gemma-4-E2B-it-Q8_0.gguf"
template = "bin/llama/gemma.jinja"
host = "127.0.0.1"
port = 8080
threads = 4
# Model-specific flags stay here. Paths are relative to this workspace.
server_args = [
    "--ctx-size", "32768", "--n-gpu-layers", "999",
    "--batch-size", "1152", "--ubatch-size", "1152", "--image-max-tokens", "1120",
]
[brain.options]
temperature = 1.0
top_k = 64
top_p = 0.95
min_p = 0.0
max_tokens = -1
chat_template_kwargs = { enable_thinking = true, preserve_thinking = false }

[eyes]
max_side = 1920

[cloud]
model = "gpt-5.6-luna-none"
command = [
    "%LOCALAPPDATA%/cursor-agent/versions/2026.10.01-e373342/node.exe",
    "%LOCALAPPDATA%/cursor-agent/versions/2026.10.01-e373342/index.js",
]

[ears]
vad_threshold = 0.65
min_silence_ms = 700
pad_ms = 120
model = "nemotron-3.5-asr-streaming-0.6b.q8_0.gguf"

[mouth]
model = "chatterbox-nano-t3-q8_0.gguf"
codec = "chatterbox-turbo-s3gen-q8_0.gguf"
reference = "reference.wav"
host = "127.0.0.1"
port = 8091

[telegram]
tdata = "%APPDATA%/Telegram Desktop/tdata"
desk_fps = 12

[install]
llama_tag = "b11435"
mouth_url = "https://github.com/CrispStrobe/CrispASR/releases/download/v0.8.41/crispasr-windows-x86_64-vulkan.zip"
mouth_version = "v0.8.41"
t3_url = "https://huggingface.co/cstr/chatterbox-nano-GGUF/resolve/main/chatterbox-nano-t3-q8_0.gguf"
s3_url = "https://huggingface.co/cstr/chatterbox-turbo-GGUF/resolve/main/chatterbox-turbo-s3gen-q8_0.gguf"
template_url = "https://huggingface.co/google/gemma-4-E2B-it/resolve/3e22461f65e89153144f8adb70e3b8c2cc9845a7/chat_template.jinja"
nemo_url = "https://github.com/NVIDIA/NeMo-Speech.cpp/releases/download/v0.1.0/nemo-speech-0.1.0-windows-x86_64-vulkan.zip"
gemma_url = "https://huggingface.co/ggml-org/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_0.gguf"
mmproj_url = "https://huggingface.co/ggml-org/gemma-4-E2B-it-GGUF/resolve/main/mmproj-gemma-4-E2B-it-Q8_0.gguf"
ear_url = "https://huggingface.co/nvidia/nemotron-3.5-asr-streaming-0.6b/resolve/main/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf"
silero_url = "https://github.com/snakers4/silero-vad/raw/master/src/silero_vad/data/silero_vad.onnx"
