[registers.timer]
"00" = "read: redial waiting state, 00 idle or 01 waiting"
"02" = "write: schedule a missed call redial"
"03" = "write: cancel redial"
[registers.telegram]
"00" = "read: call state, 00 down, 01 dialing, 02 connected"
"01" = "write: dial Wojciech for a live call"
"02" = "write: end the call"
"10" = "write: short spoken English; call speech, off-call voice note or chat"
"11" = "write: tools-only untouched image album, path newline caption, items separated by U+001E"
"20" = "write: voice-only PCM16 WAV path for the call"
"21" = "write: voice-only OGG Opus path for a voice note"
[registers.ears]
"01" = "write: owner mono PCM16 path to transcribe"
[registers.voice]
"01" = "write: synthesize call speech"
"02" = "write: synthesize an off-call voice note"
[registers.tools]
"01" = "read: name.png optionally xmin ymin xmax ymax; new screenshot path, unseen until 03"
"02" = "read: Windows shell command; exit, stdout, stderr; exit zero is launch only"
"03" = "read: newest picture path for areas; or path newline target bounding box, crop transcription, or semantic question ending Answer yes or no. Full-screen bbox_2d and centre_y_x."
"04" = "read: click y x; draw y x y x ... for one continuous stroke, spaces only; type text; key name. Returns after-shot path."
[registers.mind]
"00" = "read: 00 available, 01 processing"
"01" = "write: next step, plan, or device result"
"f0" = "read: engine identity"
[registers.memory]
"01" = "write/read: append task record; read returns decimal id"
"02" = "read: record selected by decimal id"
"03" = "read: latest task record"
