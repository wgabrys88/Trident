[owner]
telegram_id = 5884279027

[luna]
model = "gpt-5.6-luna"
reasoning = "none"
machine = "trident-nvidia"

[telegram]
tdata = "%APPDATA%/Telegram Desktop/tdata"

[ears]
model = "artifacts/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf"
library = "artifacts/nemo-cpu/bin/nemo_speech_asr_c.dll"
rms_threshold = 0.012
silence_ms = 700
padding_ms = 120
utterance_seconds = 30

[voice]
url = "http://127.0.0.1:8091"
command = ["artifacts/voice/crispasr.exe", "--server", "--host", "127.0.0.1", "--port", "8091", "--backend", "chatterbox-nano", "-m", "artifacts/chatterbox-nano-t3-q4_k.gguf", "--codec-model", "artifacts/chatterbox-turbo-s3gen-q4_k.gguf", "--gpu-backend", "vulkan", "--tts-steps", "2", "--no-punctuation"]

[install]
nemo_url = "https://github.com/NVIDIA/NeMo-Speech.cpp/releases/download/v0.1.0/nemo-speech-0.1.0-windows-x86_64-cpu.zip"
voice_url = "https://github.com/CrispStrobe/CrispASR/releases/download/v0.8.41/crispasr-windows-x86_64-vulkan.zip"

[install.models]
"nemotron-3.5-asr-streaming-0.6b.q8_0.gguf" = "https://huggingface.co/nvidia/nemotron-3.5-asr-streaming-0.6b/resolve/main/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf"
"chatterbox-nano-t3-q4_k.gguf" = "https://huggingface.co/cstr/chatterbox-nano-GGUF/resolve/main/chatterbox-nano-t3-q4_k.gguf"
"chatterbox-turbo-s3gen-q4_k.gguf" = "https://huggingface.co/cstr/chatterbox-turbo-GGUF/resolve/main/chatterbox-turbo-s3gen-q4_k.gguf"
