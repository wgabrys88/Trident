cudart = "https://github.com/ggml-org/llama.cpp/releases/download/b11435/cudart-llama-bin-win-cuda-12.4-x64.zip"
[downloads.destinations]
ears = "artifacts/ears"
voice = "artifacts/voice"
llama = "artifacts/llama"
cudart = "artifacts/llama"
