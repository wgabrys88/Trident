command = ["%LOCALAPPDATA%/cursor-agent/versions", "node.exe", "index.js", "-p", "--model", "{model}", "--output-format", "text", "--trust", "--workspace", "{run}", "--exclude-tools", "{tools}"]

[mind.lfm]
manufacturer = "local"
part = "LFM2.5-VL-3B"
revision = "Q4_K_M"
capabilities = "text"
transport = "http"
url = "http://127.0.0.1:8080"
model = "lfm"
turn = 150
context_chars = 32000

[telegram]
tdata = "%APPDATA%/Telegram Desktop/tdata"
min_layer = 65
dh_bytes = 256
request_retries = 0
connection_retries = 0
flood_sleep_threshold = 0

[ears]
model = "artifacts/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf"
library = "artifacts/nemo-cpu/bin/nemo_speech_asr_c.dll"
rms_threshold = 0.012
silence_ms = 700
padding_ms = 120
utterance_seconds = 30

[voice]
url = "http://127.0.0.1:8091"
command = ["artifacts/voice/crispasr.exe", "--server", "--host", "127.0.0.1", "--port", "8091", "--backend", "chatterbox-nano", "-m", "artifacts/chatterbox-nano-t3-q4_k.gguf", "--codec-model", "artifacts/chatterbox-turbo-s3gen-q4_k.gguf", "--gpu-backend", "vulkan", "--tts-steps", "2", "--no-punctuation"]

[vision]
url = "http://127.0.0.1:8080"
