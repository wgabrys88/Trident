[address]
timer = "10"
telegram = "11"
ears = "12"
voice = "13"
tools = "14"
mind = "16"
memory = "50"
[modules]
timer = "peripherals.py"
telegram = "telegram.py"
ears = "audio.py"
voice = "audio.py"
tools = "tools.py"
mind = "mind.py"
memory = "peripherals.py"
[bus]
frame_timeout = 5
poll = 0.05
data_retries = 1
self_turn_cap = 64
fault_turns = 3

[holds]
tools = 7200

[supply]
backoff = 1
backoff_multiplier = 2
backoff_cap = 30
restart_cap = 3
stable_seconds = 30
stop_seconds = 30

[limits]
grid = 1000
http_timeout = 7100
health_timeout = 10
health_poll = 0.2
install_timeout = 3600

[timer]
redial_seconds = 120
redial_cap = 3
idle_seconds = 900
idle_text = "Idle check from the timer, not the owner's words: take one full-screen screenshot and ask 03 once what is on screen."

[telegram]
owner = 5884279027
tdata = "%APPDATA%/Telegram Desktop/tdata"
min_layer = 65
dh_bytes = 256
random_id_max = 2147483648
ring_seconds = 90
connect_seconds = 30
chat_chars = 4096
voice_notes = true
caption_chars = 1024
bridge = "20"
bridge_seconds = 300
bridge_always = false
bridge_release = "back to Luna"

[audio]
receive_rate = 16000
send_rate = 48000
sample_bytes = 2
send_frame_bytes = 960
frame_ms = 20
rms_threshold = 0.012
silence_ms = 1600
min_speech_ms = 200
barge_in_ms = 300
barge_hold_seconds = 2
padding_ms = 120
utterance_seconds = 30

[ears]
model = "artifacts/nemotron-speech-streaming-en-0.6b.q8_0.gguf"
library = "artifacts/ears/bin/nemo_speech_asr_c.dll"
gpu = 0
start_seconds = 300

[voice]
url = "http://127.0.0.1:8091"
start_seconds = 300
http_seconds = 300
command = ["artifacts/voice/crispasr-windows-x86_64-cuda126/crispasr.exe", "--server", "--host", "127.0.0.1", "--port", "8091", "--backend", "chatterbox-nano", "-m", "artifacts/chatterbox-nano-t3-q4_k.gguf", "--codec-model", "artifacts/chatterbox-turbo-s3gen-q4_k.gguf", "--gpu-backend", "cuda", "--no-punctuation"]

[mind.luna]
identity = ["cursor", "gpt-5.6-luna-none", "cli", "text"]
transport = "exec"
model = "gpt-5.6-luna-none"
turn_seconds = 7200
context_chars = 400000
versions = "%LOCALAPPDATA%/cursor-agent/versions"
executable = "node.exe"
entry = "index.js"
arguments = ["-e", "process.argv.push(require('node:fs').readFileSync(0,'utf8'));require(process.argv[1]);", "{entry}", "-p", "--model", "{model}", "--output-format", "stream-json", "--trust", "--workspace", "{run}", "--exclude-tools", "{excluded_tools}"]
excluded_tools = "side_question_tool_call,shell_tool_call,delete_tool_call,glob_tool_call,grep_tool_call,read_tool_call,update_todos_tool_call,read_todos_tool_call,edit_tool_call,ls_tool_call,read_lints_tool_call,mcp_tool_call,sem_search_tool_call,create_plan_tool_call,web_search_tool_call,task_tool_call,list_mcp_resources_tool_call,read_mcp_resource_tool_call,apply_agent_diff_tool_call,ask_question_tool_call,fetch_tool_call,switch_mode_tool_call,generate_image_tool_call,record_screen_tool_call,computer_use_tool_call,write_shell_stdin_tool_call,reflect_tool_call,setup_vm_environment_tool_call,truncated_tool_call,start_grind_execution_tool_call,start_grind_planning_tool_call,web_fetch_tool_call,report_bugfix_results_tool_call,ai_attribution_tool_call,pr_management_tool_call,mcp_auth_tool_call,await_tool_call,blame_by_file_path_tool_call,get_mcp_tools_tool_call,report_bug_tool_call,set_active_branch_tool_call,communicate_update_tool_call,send_final_summary_tool_call,update_pr_code_tour_tool_call,replace_env_tool_call,edit_pr_labels_tool_call,record_ci_investigation_findings_tool_call,send_message_tool_call,fetch_cloud_agent_data_tool_call,send_to_user_tool_call,pi_read_tool_call,pi_bash_tool_call,pi_edit_tool_call,pi_write_tool_call,pi_grep_tool_call,pi_find_tool_call,pi_ls_tool_call,connect_scm_tool_call,search_conversations_tool_call,create_goal_tool_call,update_goal_tool_call,adopt_tool_call,get_agent_status_tool_call,read_agent_transcript_tool_call,create_agent_tool_call,stop_agent_tool_call,get_pr_code_tour_tool_call,write_canvas_tool_call,read_canvas_tool_call"

[mind.lfm]
identity = ["LiquidAI", "LFM2.5-VL-3B", "Q4_K_M", "text"]
transport = "post"
url = "http://127.0.0.1:8081"
port = 8081
turn_seconds = 7200
context_chars = 100000
start_seconds = 300
max_tokens = 32768

[llama]
model = "lfm"
host = "127.0.0.1"
device = "CUDA0"
gpu_layers = 999
context_tokens = 32768
parallel = 1
batch_tokens = 2048
microbatch_tokens = 512
image_min_tokens = 64
image_max_tokens = 256
flash_attention = "on"
cache_k = "f16"
cache_v = "f16"
fit = "off"
reasoning = "on"
reasoning_format = "deepseek"
reasoning_budget = -1
command = ["artifacts/llama/llama-server.exe", "--model", "artifacts/LFM2.5-VL-3B-Q4_K_M.gguf", "--mmproj", "artifacts/mmproj-LFM2.5-VL-3B-Q8_0.gguf", "--mmproj-offload", "--mmproj-device", "{device}", "--image-min-tokens", "{image_min_tokens}", "--image-max-tokens", "{image_max_tokens}", "--alias", "{model}", "--host", "{host}", "--port", "{port}", "--jinja", "--ctx-size", "{context_tokens}", "--device", "{device}", "--n-gpu-layers", "{gpu_layers}", "--parallel", "{parallel}", "--batch-size", "{batch_tokens}", "--ubatch-size", "{microbatch_tokens}", "--flash-attn", "{flash_attention}", "--cache-type-k", "{cache_k}", "--cache-type-v", "{cache_v}", "--reasoning", "{reasoning}", "--reasoning-format", "{reasoning_format}", "--reasoning-budget", "{reasoning_budget}", "--no-context-shift", "--no-webui", "--fit", "{fit}"]

[sampling]
temperature = 0.2
top_k = 50
top_p = 1.0
min_p = 0.0
repeat_penalty = 1.0
reasoning_format = "deepseek"

[vision]
url = "http://127.0.0.1:8080"
port = 8080
context_tokens = 4096
reasoning = "off"
start_seconds = 300
max_tokens = 1024
prompt = "List the visible windows, dialogs, panels and main controls (up to 8) as a JSON array, one item each: {{\"label\":\"<short name>\",\"bbox_2d\":[xmin,ymin,xmax,ymax],\"note\":\"<what is inside>\"}}. Label an item dialog only if a popup box really covers part of a window. Coordinates 0-{grid}."
image_side = 1024
[tools]
command_seconds = 7180
input_pause = 0.1
settle_ms = 5000
start_settle_ms = 5000

[memory]
path = "life/memory.sqlite"

[registers.timer]
"00" = "read: 00 idle, 01 waiting"
"02" = "write: missed dial"
"03" = "write: cancel redial"
[registers.telegram]
"00" = "read: 00 down, 01 dialing, 02 up"
"01" = "write: dial the owner for a live call, only when he is needed live"
"02" = "write: hang up the call"
"10" = "write: plain sentences for the owner; spoken during a call, otherwise sent to him as a message"
"11" = "write: copy of vision traffic, from tools only, never the mind"
"20" = "write: PCM16 WAV path played into the call, from voice only"
"21" = "write: OGG Opus path sent as a voice note, from voice only"
[registers.ears]
"01" = "write: mono PCM16 path, owner speech goes to mind"
[registers.voice]
"01" = "write: words to synthesize for the call"
"02" = "write: words to synthesize as a Telegram voice note"
[registers.tools]
"01" = "read: new picture file name without spaces, optionally followed by xmin ymin xmax ymax copied from a map box to zoom in; returns its absolute path; you see nothing until 03"
"02" = "read: executable Windows command line; returns exit code, stdout and stderr; exit 0 only means it started"
"03" = "read: absolute picture path alone for a map of labelled areas, or path, newline, one question ending 'Reply with one bbox_2d JSON.' or 'Answer yes or no.', or 'Transcribe the visible text.' on a zoom; every bbox_2d [xmin, ymin, xmax, ymax] is on the full-screen 0 to 1000 grid, followed by centre_y_x [y, x]"
"04" = "read: one input, y first on the grid: click y x, draw y x y x ... (one continuous stroke), type text, key name; returns the path of a picture taken after it"
[registers.mind]
"00" = "read: 00 free, 01 busy"
"01" = "write: your own next turn within its cap; holds your short numbered plan or a note to yourself"
"f0" = "read: manufacturer, part, revision, capabilities"
[registers.memory]
"01" = "write/read: append one record, such as a parked or finished task; read returns its decimal id"
"02" = "read: decimal record id; returns that record"
"03" = "read: the latest record, the top of your task stack; empty when there are none"

