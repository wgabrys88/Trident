start_seconds = 300
context = 32768
command = ["artifacts/llama/llama-server.exe", "-m", "{models}/LFM2.5-VL-3B-Q4_K_M.gguf", "--mmproj", "{models}/mmproj-LFM2.5-VL-3B-Q8_0.gguf", "--mmproj-offload", "--mmproj-device", "CUDA0", "--image-min-tokens", "64", "--image-max-tokens", "256", "--alias", "{model}", "--host", "127.0.0.1", "--port", "{port}", "--jinja", "--ctx-size", "{context}", "--device", "CUDA0", "-ngl", "999", "--parallel", "1", "--batch-size", "2048", "--ubatch-size", "512", "--flash-attn", "on", "--cache-type-k", "f16", "--cache-type-v", "f16", "--reasoning", "{reasoning}", "--reasoning-format", "deepseek", "--reasoning-budget", "-1", "--no-context-shift", "--no-webui", "--fit", "off"]
reasoning = "on"
[sampling]
temperature = 0.2
top_k = 50
top_p = 1.0
min_p = 0.0
repeat_penalty = 1.0
[vision]
url = "http://127.0.0.1:8080"
port = 8080
context = 4096
reasoning = "off"
max_tokens = 1024
image_side = 768
temperature = 0
overview = "Describe the visible desktop state, the active window and its actionable controls. Identify uncertainty; do not infer hidden effects. State only what is visible, and do not invent a clock reading or a measurement."
boxes_system = "When asked for bounding boxes for objects, return a valid JSON array. Each item has image_id, bbox_2d: [xmin, ymin, xmax, ymax] normalized to integers from 0 to 1000, and label. Return one item per visible matching object or region. Return [] if none are visible."
text_system = "Answer the request about the supplied image. State only what is visible. If it is not visible, say so."
[tools]
command_seconds = 7180
input_pause = 0.1
settle_seconds = 5
launch_seconds = 5
[actions]
say = "TEXT | the owner hears it and you are asked for the next step"
done = "TEXT | ends the task after the effect was performed and checked"
nothing = "| no step remains"
[registers.timer]
"00" = "read: redial_state | | 00 idle or 01 waiting"
"02" = "write: schedule_redial | | accepted; the effect is not verified yet"
"03" = "write: cancel_redial | | accepted; the effect is not verified yet"
[registers.telegram]
"00" = "read: call_state | | 00 down, 01 dialing, 02 connected"
"01" = "write: dial | | places a call only when the device already has owner permission"
"02" = "write: hangup | | ends the call"
"10" = "write: - | | owner speech is say or done"
"11" = "write: album | PATH\nCAPTION | submits an image album; not confirmed delivery"
"20" = "write: call_audio | PATH | plays that pcm wav on the call"
"21" = "write: note_audio | PATH | plays that ogg as a voice note"
[registers.ears]
"01" = "write: transcribe | PATH | transcript text"
[registers.voice]
"01" = "write: speak_call | TEXT | synthesizes call speech"
"02" = "write: speak_note | TEXT | synthesizes an off-call voice note"
[registers.tools]
"01" = "read: screenshot | NAME.png | a new picture path; the picture is unseen until look"
"02" = "read: command | COMMAND | exit code and output; exit zero means launch only"
"03" = "read: look | PATH | an answer about that picture. PATH is a picture path a result already returned. Send PATH alone for the overview. A newline then a question asks something specific. A question containing bounding box, bbox, or bounds returns a JSON array of bbox_2d [xmin, ymin, xmax, ymax] and centre_y_x [Y, X], integers 0-1000."
"04" = "read: stroke | draw Y X Y X | an after-shot path, unseen until look. Shapes: click Y X; draw Y X Y X Y X; type TEXT; key NAME. Y then X, integers 0-1000, the same order as centre_y_x. Y is vertical and stays within ymin and ymax; X is horizontal and stays within xmin and xmax. Replace every capital placeholder."
"05" = "read: share | PATH | submission, not confirmed delivery"
[registers.mind]
"00" = "read: - | | internal"
"01" = "write: - | | internal"
"f0" = "read: - | | internal"
[registers.memory]
"01" = "write/read: remember | TEXT | a decimal id"
"02" = "read: recall | ID | the note for that id"
"03" = "read: latest | | the latest note"
