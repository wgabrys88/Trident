[owner]
telegram_id = 5884279027

[address]
timer = "10"
telegram = "11"
ears = "12"
voice = "13"
tools = "14"
luna = "16"
memory = "50"

[bus]
frame_timeout = 2
poll = 0.05
bus_off = 32
backoff = 1
retry_seconds = 120
redial_cap = 3
self_turn_cap = 4
luna_start_cap = 3
stable_seconds = 30

[busy]
timer = 2
telegram = 8
ears = 30
voice = 60
tools = 90
luna = 150
memory = 2

[luna]
model = "gpt-5.6-luna-none"
command = ["%LOCALAPPDATA%/cursor-agent/versions"]

[telegram]
tdata = "%APPDATA%/Telegram Desktop/tdata"

[ears]
model = "artifacts/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf"
library = "artifacts/nemo-cpu/bin/nemo_speech_asr_c.dll"
rms_threshold = 0.012
silence_ms = 700
padding_ms = 120
utterance_seconds = 30

[voice]
url = "http://127.0.0.1:8091"
command = ["artifacts/voice/crispasr.exe", "--server", "--host", "127.0.0.1", "--port", "8091", "--backend", "chatterbox-nano", "-m", "artifacts/chatterbox-nano-t3-q4_k.gguf", "--codec-model", "artifacts/chatterbox-turbo-s3gen-q4_k.gguf", "--gpu-backend", "vulkan", "--tts-steps", "2", "--no-punctuation"]

[vision]
url = "http://127.0.0.1:8080"
command = ["artifacts/llama/llama-server.exe", "--model", "artifacts/LFM2.5-VL-3B-Q4_K_M.gguf", "--mmproj", "artifacts/mmproj-LFM2.5-VL-3B-Q8_0.gguf", "--mmproj-offload", "--mmproj-device", "CUDA0", "--image-max-tokens", "256", "--alias", "lfm", "--host", "127.0.0.1", "--port", "8080", "--jinja", "--ctx-size", "32768", "--device", "CUDA0", "--n-gpu-layers", "999", "--parallel", "1", "--flash-attn", "on", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0", "--no-context-shift", "--no-webui", "--fit", "off"]

[memory]
path = "life/memory.sqlite"

[fetch.models]
"nemotron-3.5-asr-streaming-0.6b.q8_0.gguf" = "https://huggingface.co/nvidia/nemotron-3.5-asr-streaming-0.6b/resolve/main/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf"
"chatterbox-nano-t3-q4_k.gguf" = "https://huggingface.co/cstr/chatterbox-nano-GGUF/resolve/main/chatterbox-nano-t3-q4_k.gguf"
"chatterbox-turbo-s3gen-q4_k.gguf" = "https://huggingface.co/cstr/chatterbox-turbo-GGUF/resolve/main/chatterbox-turbo-s3gen-q4_k.gguf"
"LFM2.5-VL-3B-Q4_K_M.gguf" = "https://huggingface.co/LiquidAI/LFM2.5-VL-3B-GGUF/resolve/main/LFM2.5-VL-3B-Q4_K_M.gguf"
"mmproj-LFM2.5-VL-3B-Q8_0.gguf" = "https://huggingface.co/LiquidAI/LFM2.5-VL-3B-GGUF/resolve/main/mmproj-LFM2.5-VL-3B-Q8_0.gguf"

[fetch.archives]
ear = "https://github.com/NVIDIA/NeMo-Speech.cpp/releases/download/v0.1.0/nemo-speech-0.1.0-windows-x86_64-cpu.zip"
voice = "https://github.com/CrispStrobe/CrispASR/releases/download/v0.8.41/crispasr-windows-x86_64-vulkan.zip"
llama = "https://github.com/ggml-org/llama.cpp/releases/download/b11435/llama-b11435-bin-win-cuda-12.4-x64.zip"
cudart = "https://github.com/ggml-org/llama.cpp/releases/download/b11435/cudart-llama-bin-win-cuda-12.4-x64.zip"

[fetch.unpack]
ear = "artifacts/nemo-cpu"
voice = "artifacts/voice"
llama = "artifacts/llama"
cudart = "artifacts/llama"
