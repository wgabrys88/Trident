<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trident</title>
</head>
<body>
<p>
  <span id="connection">offline</span>
  <button id="install">Install</button>
  <button id="engines">Start</button>
  <span id="live">Start engines, then speak, upload, or type.</span>
</p>
<p id="dots"></p>
<p>
  Heard <span id="asr-state">idle</span><br>
  <textarea id="transcript" rows="8" cols="60" placeholder="Parakeet. Type or speak."></textarea><br>
  <label><input id="heard-auto" type="checkbox" checked> Auto</label>
  <button id="heard-send" disabled>Send</button>
</p>
<p>
  Answer <span id="brain-state">idle</span><br>
  <textarea id="answer" rows="8" cols="60" placeholder="Spoken text. Auto off freezes."></textarea><br>
  <label><input id="answer-auto" type="checkbox" checked> Auto</label>
  <button id="answer-send" disabled>Send</button>
</p>
<p>
  Played <span id="played-state">idle</span><br>
  <textarea id="played" rows="8" cols="60" readonly placeholder="Parakeet of the packs the browser played."></textarea>
</p>
<p id="fault" hidden></p>
<p>
  <button id="record" disabled>Mic</button>
  <input id="audio-file" type="file" accept="audio/*" disabled>
  <label><input id="clone" type="checkbox"> Clone</label>
  Reply <select id="reply-language"></select>
  <button id="stop-voice" disabled>Stop</button>
</p>
<script src="/panel.js"></script>
</body>
</html>
