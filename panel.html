<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trident</title>
<link rel="stylesheet" href="/panel.css">
</head>
<body>
<main class="shell">
  <div class="bar">
    <div id="dots" class="dots"></div>
    <b>Trident</b>
    <span id="connection" class="pill bad">offline</span>
    <button id="install">Install</button>
    <button id="engines" class="primary">Start</button>
    <span id="job-status" class="job"></span>
  </div>
  <div class="bar">
    <button id="record" class="mic" disabled>Mic</button>
    <label class="file">File<input id="audio-file" type="file" accept="audio/*" disabled></label>
    <label class="check"><input id="clone" type="checkbox"> Clone</label>
    <label>Reply <select id="reply-language"></select></label>
    <button id="stop-voice" disabled>Stop</button>
  </div>
  <div class="bar">
    <textarea id="speak-text" rows="2" placeholder="Type text for Chatterbox."></textarea>
    <label>Speak <select id="input-language"></select></label>
    <button id="speak-run" disabled>Speak</button>
  </div>
  <details class="knobs">
    <summary>Knobs</summary>
    <div id="knobs"></div>
  </details>
  <p id="mic-status" class="live">Start engines, then speak, upload, or type.</p>
  <div class="conversation">
    <article>
      <div class="label"><span>Heard</span><small id="asr-state">idle</small></div>
      <p id="transcript" class="text muted">Transcription appears here.</p>
    </article>
    <article>
      <div class="label"><span>Answer</span><small id="brain-state">idle</small></div>
      <p id="answer" class="text muted">The local response appears here.</p>
    </article>
  </div>
  <p id="fault" class="fault" hidden></p>
</main>
<script src="/panel.js"></script>
</body>
</html>
