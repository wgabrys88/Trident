owner = 5884279027
tdata = '%APPDATA%/Telegram Desktop/tdata'
decision_model = 'typesafe/jev-1.13'
vision_url = 'http://127.0.0.1:8188'
vision_alias = 'retina'
vision_model = 'LFM2.5-VL-3B-Q4_K_M.gguf'
vision_projector = 'mmproj-LFM2.5-VL-3B-Q8_0.gguf'
ctx_size = 32768
image_tokens = 8192
asr_model = 'tiny.en'
seconds = 600

[capabilities]
look = 'question: a long question about this screen. Optional region [xmin,ymin,xmax,ymax] from 0 to 1000. Looks again and does not click.'
launch = 'app: the executable, the document, or the installed application name. Opens it. The window is not focused until focus.'
browse = 'url: the full address, including https://. Opens the registered browser. The window is not focused until focus.'
focus = 'title: words that appear in a visible window title. Brings that window to the front.'
key = 'keys: Enter, ctrl+shift+s, or a list such as [ctrl, shift, s]. window: the foreground window id you saw. Sends those real keys.'
type = 'text: the full text to paste. window: the foreground window id you saw. Pastes. A later key action presses Enter.'
click = 'target: the target id named in this message. Optional points [[x,y],...] inside that box, from 0 to 1. The default point is the center.'
draw = 'target: the target id named in this message. points [[x,y],...] or strokes [[[x,y],...],...] inside that box, from 0 to 1.'
authorize = 'quote: the entire current owner message, copied character for character. Grants one outgoing call for 600 seconds, and only when that message itself asks for a call. The next action is dial.'
dial = 'No arguments. Places the granted call and returns the provider result. connected true means the call is up. If the result says no provider is configured, no call was placed.'
say = 'text: the full thing to speak to the owner. Use it to speak the call result.'
done = 'text: the full thing to speak. Clears the goal and leaves the process alive.'
recall = 'query: returns archived turns whose text contains this query.'
rest = 'No arguments. Waits for the owner.'
