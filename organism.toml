owner = 5884279027
tdata = '%APPDATA%/Telegram Desktop/tdata'
mind_model = 'gpt-5.6-luna-none'
decision_model = 'typesafe/jev-1.13'
vision_url = 'http://127.0.0.1:8188'
vision_alias = 'retina'
vision_model = 'LFM2.5-VL-3B-Q4_K_M.gguf'
vision_projector = 'mmproj-LFM2.5-VL-3B-Q8_0.gguf'
ctx_size = 32768
image_tokens = 8192
asr_model = 'tiny.en'
seconds = 600

[capabilities]
look = 'question: what the eye should answer in full sentences. Optional region [xmin,ymin,xmax,ymax] normalized 0..1000.'
launch = 'app: executable, document, or installed app name. Opens it. Focus is separate.'
browse = 'url: opens the registered browser. Focus is separate.'
focus = 'title: text contained in a visible window title.'
key = 'keys: Enter, ctrl+shift+s, or [ctrl,shift,s]. window: the captured foreground window id from screen.window.id.'
type = 'text to paste. window: the captured foreground window id from screen.window.id.'
click = 'target: the eye target id. Optional points [[x,y],...] relative to that box, 0..1. The default is the center.'
draw = 'target: the eye target id. points [[x,y],...] or strokes [[[x,y],...],...] relative to that box, 0..1.'
authorize = 'quote: the entire current owner message. One attempt, and only when that message itself asks for a call.'
dial = 'No arguments. Places the authorized call and returns the provider result.'
say = 'text: the full thing to speak to the owner.'
done = 'text: the full thing to speak. Clears the goal and stays alive.'
recall = 'query: returns archived turns whose text contains this query.'
rest = 'No arguments. Waits for the owner.'
